# KodeERP F&B demo (fnb.localhost) preview reverse proxy (box user, loopback only). Production-style: static assets from disk, app via gunicorn.
worker_processes 1;
pid /tmp/kodeerp-fnb-nginx.pid;
error_log /tmp/kodeerp-fnb-nginx-error.log warn;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /tmp/kodeerp-fnb-nginx-access.log;
  client_body_temp_path /tmp/kn-fnb-nginx-body; proxy_temp_path /tmp/kn-fnb-nginx-proxy;
  fastcgi_temp_path /tmp/kn-fnb-nginx-fcgi; uwsgi_temp_path /tmp/kn-fnb-nginx-uwsgi; scgi_temp_path /tmp/kn-fnb-nginx-scgi;
  sendfile on; server_tokens off; client_max_body_size 20m;
  gzip on; gzip_types text/css application/javascript application/json image/svg+xml text/plain;
  limit_req_zone $http_cf_connecting_ip zone=kn_fnb_login:10m rate=10r/m;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  upstream kn_app { server 127.0.0.1:8001 fail_timeout=0; }
  upstream kn_sio { server 127.0.0.1:9010 fail_timeout=0; }
  server {
    listen 127.0.0.1:8093;
    server_name _;
    root /workspace/kodeerp/development/frappe-bench/sites;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "same-origin" always;
    location /assets { try_files $uri =404; expires 1h; }
    location ~ ^/protected/(.*) { internal; try_files /fnb.localhost/$1 =404; }
    location ^~ /files/ { try_files /fnb.localhost/public$uri @app; }
    location /socket.io {
      proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Frappe-Site-Name fnb.localhost; proxy_set_header Origin $scheme://$http_host; proxy_set_header Host $host;
      proxy_pass http://kn_sio;
    }
    location = /api/method/login { limit_req zone=kn_fnb_login burst=5 nodelay; try_files /dev/null @app; }
    location / { try_files /fnb.localhost/public/$uri @app; }
    location @app {
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Frappe-Site-Name fnb.localhost;
      proxy_set_header Host $host;
      proxy_set_header X-Use-X-Accel-Redirect True;
      proxy_read_timeout 120; proxy_redirect off;
      proxy_pass http://kn_app;
    }
  }
}
