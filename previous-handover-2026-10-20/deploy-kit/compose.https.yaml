# Adds Traefik in front of KodeERP with automatic Let's Encrypt certificates.
# Needs in .env: SITE_DOMAIN (e.g. erp.example.com) and LETSENCRYPT_EMAIL. DNS A record must already point here.
#   docker compose -f compose.yaml -f compose.https.yaml up -d
services:
  frontend:
    ports: !reset []
    labels:
      - traefik.enable=true
      - traefik.http.services.kodeerp.loadbalancer.server.port=8080
      - traefik.http.routers.kodeerp-http.rule=Host(`${SITE_DOMAIN:?set SITE_DOMAIN}`)
      - traefik.http.routers.kodeerp-http.entrypoints=web
      - traefik.http.routers.kodeerp-http.middlewares=kodeerp-https
      - traefik.http.middlewares.kodeerp-https.redirectscheme.scheme=https
      - traefik.http.routers.kodeerp.rule=Host(`${SITE_DOMAIN}`)
      - traefik.http.routers.kodeerp.entrypoints=websecure
      - traefik.http.routers.kodeerp.tls.certresolver=le
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    networks: [kodeerp]
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${LETSENCRYPT_EMAIL:?set LETSENCRYPT_EMAIL}
      - --certificatesresolvers.le.acme.storage=/certificates/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports: ["80:80", "443:443"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - cert-data:/certificates
volumes:
  cert-data:
